<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Markdown Web Clipper">
  <rect x="0" y="0" width="128" height="128" rx="24" fill="#0d0d0b"/>
  <!-- M strokes: two outer legs joined by a central V (the Markdown "M") -->
  <path d="M30 92 V44 L52 70 L74 44 V92"
        fill="none" stroke="#f5f2ea" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Down arrow: vertical shaft + chevron head (the Markdown "down" glyph) -->
  <path d="M97 40 V84 M84 71 L97 86 L110 71"
        fill="none" stroke="#f5f2ea" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
